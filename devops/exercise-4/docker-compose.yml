version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: app_db
    networks:
      - my-bridge-net

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    networks:
      - my-bridge-net

  flask:
    build: .
    image: flask-api:latest
    container_name: flask
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      - mysql
      - redis
    networks:
      - my-bridge-net

networks:
  my-bridge-net:
    driver: bridge
